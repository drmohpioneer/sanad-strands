    "title_ar": "ليه نتابع البوتاسيوم",
    "title_en": "Why potassium is checked",
    "topic_tags": [
      "بوتاسيوم",
      "potassium",
      "تحليل K"
    ],
    "permitted_questions": [
      "ليه الدكتور طلب بوتاسيوم مع دوا الضغط",
      "يعني إيه متابعة البوتاسيوم"
    ],
    "text_ar": "البوتاسيوم واحد من المواد اللي ممكن الدكتور يطلب قياسها في الدم مع متابعة الكلى. بعض أدوية الضغط والقلب محتاجة المتابعة دي قبل العلاج أو لما الدكتور يغيّر الجرعة. التحليل بيساعد الفريق المعالج يراجع تأثير العلاج على الجسم. طلب التحليل مش معناه لوحده إن في مشكلة اتشخصت. النتيجة بتحتاج تتشاف بالوحدة الصحيحة ومع باقي الحالة، والطبيب هو اللي يقرر معناها ليك. الشرح العام ده مبيحددش جرعة جديدة ولا تغيير في العلاج اللي اتكتب.",
    "text_en": "Potassium may be measured with kidney-function monitoring. Some blood-pressure and heart medicines require these checks before treatment or when a clinician changes a dose. Testing helps the treating team assess the medicine’s effects. A test request alone does not diagnose a problem. Results need the correct units and individual clinical context. This explanation neither supplies a new dose nor changes the existing prescription.",
    "source_url": "https://www.nhs.uk/medicines/ramipril/about-ramipril/",
