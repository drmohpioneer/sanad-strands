    "permitted_questions": [
      "لازم أصوم لتحليل الدهون",
      "ليه تحليل الدهون مش لازم صيام لكل الناس"
    ],
    "text_ar": "تحليل الدهون عينة دم بتساعد في قياس الكوليسترول وتقييم خطر مشاكل الأوعية مع عوامل تانية. أغلب الناس مش محتاجة صيام للتحليل ده، لكن في حالات الطبيب ممكن يطلب صيام. وجود تحاليل تانية في نفس الطلب ممكن يخلي تعليمات التحضير مختلفة. عشان كده المعلومة العامة مش بديل للتعليمات المكتوبة في طلبك. لو تعليمات التحضير مش واضحة، السؤال يتوجّه للدكتور أو المكان اللي هيعمل التحليل. الشرح ده مبيغيّرش أي تعليمات صريحة في خطتك.",
    "text_en": "A lipid blood test helps assess cholesterol and cardiovascular risk together with other factors. Most people do not need to fast for cholesterol testing, but fasting may be requested in some cases. Other tests ordered at the same time may have different preparation instructions. This general information does not override your own test order. Unclear preparation needs clarification from the clinician or testing service.",
    "source_url": "https://www.nhs.uk/conditions/high-cholesterol/getting-tested/",
    "source_title": "High cholesterol - Getting tested - NHS",
    "source_label": "NHS البريطانية: تحليل الدهون والصيام",
