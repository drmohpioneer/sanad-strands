      "يعني إيه ارتفاع الضغط",
      "معنى 140/90 إيه"
    ],
    "text_ar": "ضغط الدم هو قوة الدم على جدران الأوعية وهو ماشي فيها. القراءة فيها رقم وقت نبضة القلب ورقم وقت راحته بين النبضات. منظمة الصحة العالمية بتعتمد 140/90 كحد عام لارتفاع الضغط، مش كهدف شخصي ليك. تشخيص الضغط محتاج قياسات وتقييم من الطبيب. الضغط العالي ممكن يبقى موجود من غير أعراض واضحة. هدفك ومواعيد القياس الخاصة بيك بيحددهم الدكتور في خطتك، والشرح العام لوحده مبيحكمش على قراءة تخصك.",
    "text_en": "Blood pressure describes the force of blood against vessel walls. The two readings reflect the heartbeat and the rest between beats. WHO uses 140/90 as a general threshold for high blood pressure, not your personal treatment target. Diagnosis needs repeated measurements and a clinician’s assessment. High blood pressure may have no obvious symptoms. Your own targets and measurement times come from your doctor’s plan.",
    "source_url": "https://www.who.int/news-room/fact-sheets/detail/hypertension",
    "source_title": "Hypertension",
    "source_label": "منظمة الصحة العالمية: يعني إيه ضغط عالي",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "World Health Organization: High blood pressure"
  },
  {
    "id": "home_bp",
    "title_ar": "ليه نقيس الضغط في البيت",
    "title_en": "Home blood pressure readings",
    "topic_tags": [
      "قياس الضغط",
      "قياسات البيت",
      "home blood pressure"
    ],
    "permitted_questions": [
      "ليه أقيس الضغط في البيت",
      "قراءة الضغط فيها كام رقم"
    ],
    "text_ar": "قياسات الضغط في البيت بتساعد الدكتور يشوف قراءات متكررة بعيد عن زيارة العيادة. جهاز الضغط بيطلع رقمين، وحفظ الرقمين بيساعد في نقل القراءة كاملة. طريقة تشغيل الجهاز بتختلف حسب نوعه، والدكتور أو الممرض يقدر يشرح طريقة استعماله. مواعيد القياس وعدد الأيام بتبقى حسب الخطة اللي الدكتور طلبها. تسجيل القراءة مع وقتها بيوضح هي اتقاست إمتى. وجود قراءة مسجلة مش معناه إن النتيجة اتراجعت طبيا أو إن العلاج اتغير.",
    "text_en": "Home readings give your clinician repeated blood pressure measurements outside a clinic visit. Both numbers are needed to communicate the reading. Devices differ, so a clinician can explain the device instructions. Measurement times and the number of days should come from the agreed plan. Recording the measurement time helps identify each reading. Recording a value does not establish clinical review or a treatment change.",
    "source_url": "https://www.nhs.uk/tests-and-treatments/blood-pressure-test/",
    "source_title": "Blood pressure test - NHS",
    "source_label": "NHS البريطانية: ليه نقيس الضغط في البيت",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
