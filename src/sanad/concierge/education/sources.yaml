    "source_label_en": "NHS: Why potassium is checked"
  },
  {
    "id": "creatinine",
    "title_ar": "تحليل الكرياتينين ووظائف الكلى",
    "title_en": "Creatinine and kidney function",
    "topic_tags": [
      "كرياتينين",
      "creatinine",
      "وظائف الكلى"
    ],
    "permitted_questions": [
      "يعني إيه كرياتينين",
      "ليه تحليل وظائف الكلى مهم"
    ],
    "text_ar": "الكرياتينين مادة من فضلات الجسم، وقياسها في الدم جزء من تقييم شغل الكلى. الطبيب ممكن يستعين بالنتيجة مع معلومات تانية عشان يقدّر قدرة الكلى على الترشيح. في حالات بيحتاج كمان تحليل بول أو فحوص إضافية. رقم واحد من غير وحدة ولا سياق مش كفاية عشان نحكم على الحالة. متابعة التحاليل بتتفسر مع التاريخ المرضي وتعليمات الدكتور. دور الشرح هنا يفهمك اسم التحليل، مش يقول إن الكلى سليمة أو يغيّر دواء بسبب الرقم.",
    "text_en": "Creatinine is a waste product measured as part of kidney assessment. Clinicians may combine its level with other information to estimate kidney filtration. Urine tests or other investigations may also be needed. A number without its units and clinical context is insufficient for an individual conclusion. This explains the test rather than declaring the kidneys healthy or changing a medicine because of a result.",
    "source_url": "https://www.nhs.uk/conditions/kidney-disease/diagnosis/",
    "source_title": "Chronic kidney disease - Diagnosis - NHS",
    "source_label": "NHS البريطانية: تحليل الكرياتينين ووظائف الكلى",
