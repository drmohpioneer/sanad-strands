[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "sanad"
version = "0.1.0"
description = "Sanad offline foundation and typed domain boundaries"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "tzdata==2026.3",
    "boto3==1.43.89",
]

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "httpx==0.28.1",
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sanad"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/.python-version", "/Makefile", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
