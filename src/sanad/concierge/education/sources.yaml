  {
    "id": "heart_failure",
    "title_ar": "ضعف القلب ومتابعة الوزن",
    "title_en": "Heart failure and weight",
    "topic_tags": [
      "ضعف القلب",
      "هبوط القلب",
      "وزن",
      "heart failure"
    ],
    "permitted_questions": [
      "يعني إيه ضعف عضلة القلب",
      "ليه الدكتور طلب متابعة الوزن"
    ],
    "text_ar": "ضعف القلب معناه إن القلب مش بيضخ الدم بالكفاءة اللي الجسم محتاجها. الاسم مش معناه إن القلب وقف عن الشغل. بعض الناس ممكن يحصل عندها تجمع سوائل، وده ممكن يظهر في الوزن أو تورم الرجلين. عشان كده متابعة الوزن ممكن تبقى جزء من خطة الدكتور. التغير في الوزن محتاج يتشاف مع باقي الحالة، مش يتفسر من رقم لوحده. مواعيد الوزن وأي تعليمات خاصة بالسوائل أو الأكل لازم تكون من خطتك الشخصية.",
    "text_en": "Heart failure means the heart does not pump blood as effectively as the body needs. It does not mean the heart has stopped. Fluid can accumulate and may affect body weight or cause swollen legs. Weight monitoring may therefore be part of a doctor’s plan. A change needs clinical context rather than interpretation from a single number. Personal weighing schedules and fluid instructions belong to the care plan.",
    "source_url": "https://www.nhs.uk/conditions/heart-failure/",
    "source_title": "Heart failure - NHS",
    "source_label": "NHS البريطانية: ضعف القلب ومتابعة الوزن",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: Heart failure and weight"
  },
  {
    "id": "atrial_fibrillation",
    "title_ar": "يعني إيه رجفان أذيني",
    "title_en": "Atrial fibrillation",
    "topic_tags": [
      "رجفان أذيني",
      "ذبذبة أذينية",
      "atrial fibrillation",
      "AF"
    ],
    "permitted_questions": [
      "يعني إيه رجفان أذيني",
      "إيه معنى لخبطة ضربات القلب"
    ],
    "text_ar": "الرجفان الأذيني نوع من اضطراب إيقاع القلب، وبيخلي النبض مش منتظم. ممكن ييجي مع خفقان أو تعب، وفي ناس مبتحسش بأعراض. الإحساس بالخفقان لوحده ميأكدش إن الشخص عنده رجفان أذيني. الطبيب بيقيّم الأعراض ويطلب الفحوص المناسبة عشان يعرف السبب. بعض المصابين محتاجين علاج لتقليل احتمال الجلطات حسب تقييمهم الشخصي. الكلام ده شرح للاسم، مش تشخيص ليك ولا اختيار لدوا، وتعليماتك الخاصة هي اللي الدكتور سجلها في الخطة.",
    "text_en": "Atrial fibrillation is an irregular heart rhythm. It can cause palpitations or tiredness, and some people have no symptoms. Palpitations alone do not establish the diagnosis. A clinician assesses symptoms and tests to identify their cause. Clot prevention can be part of the clinician’s individually assessed plan. This explains the term; it does not diagnose you or select a medicine. Personal instructions come from your plan.",
    "source_url": "https://www.nhs.uk/conditions/atrial-fibrillation/",
    "source_title": "Atrial fibrillation - NHS",
    "source_label": "NHS البريطانية: يعني إيه رجفان أذيني",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: Atrial fibrillation"
  },
  {
    "id": "anticoagulants",
    "title_ar": "السيولة وعلامات النزيف",
    "title_en": "Anticoagulants and bleeding",
    "topic_tags": [
      "سيولة",
      "مضادات التجلط",
      "نزيف",
      "anticoagulants"
    ],
    "permitted_questions": [
      "ليه أدوية السيولة مهمة",
      "إيه علامات النزيف مع السيولة"
    ],
    "text_ar": "أدوية السيولة بتقلل تكوّن الجلطات، والاسم الدارج مش معناه إنها بتحول الدم لمية. الطبيب بيختارها لبعض الناس حسب خطر الجلطات عندهم. النزيف من المخاطر اللي لازم تبقى معروفة مع المجموعة دي. وجود دم في البول أو البراز، أو قيء دموي، أمثلة لعلامات محتاجة اهتمام طبي. ده شرح عام للمجموعة، مش حكم على عرض معين عندك. سؤال نسيان جرعة أو تغيير العلاج بيتراجع مع الطبيب، ومفيش جرعة بديلة بتتحدد من الشرح ده.",
    "text_en": "Anticoagulants reduce clot formation; they do not literally turn blood into a thinner liquid. Clinicians prescribe them according to clot risk. Bleeding is a risk patients should understand. Blood in urine or stool, and vomiting blood, are examples of signs needing medical attention. This is general information rather than an assessment of your symptoms. Missed-dose and treatment-change questions need professional advice; this explanation gives no replacement dose.",
    "source_url": "https://www.nhs.uk/medicines/anticoagulants/",
    "source_title": "Anticoagulant medicines - NHS",
    "source_label": "NHS البريطانية: السيولة وعلامات النزيف",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: Anticoagulants and bleeding"
  },
  {
    "id": "inr",
    "title_ar": "تحليل سيولة الدم",
    "title_en": "The INR blood test",
    "topic_tags": [
      "INR",
      "تحليل السيولة",
      "نسيان السيولة"
    ],
    "permitted_questions": [
      "ليه الدكتور طلب INR",
      "ليه مينفعش أتجاهل متابعة السيولة"
    ],
    "text_ar": "تحليل INR بيقيس زمن تجلط الدم بطريقة موحدة، وبيساعد في متابعة نوع معين من أدوية السيولة. نتيجته بتساعد الفريق المعالج يراجع تأثير الدوا والتوازن بين خطر الجلطات وخطر النزيف. مش كل أدوية السيولة محتاجة نفس التحليل أو نفس المتابعة. الجرعة ومواعيد الفحوص والهدف المناسب بيختلفوا حسب حالة الشخص وأمر الدكتور. نسيان العلاج أو المتابعة ممكن يأثر على الحماية المطلوبة، وسؤال الجرعة المنسية يتوجّه للطبيب. التحليل هنا معلومة عامة من غير هدف رقمي شخصي.",
    "text_en": "INR standardizes a measure of blood clotting time and is used to monitor a particular anticoagulant treatment. It helps the treating team assess the balance between clotting and bleeding risks. Not every anticoagulant uses the same test. Doses, testing schedules and targets depend on the person and clinician’s instructions. Missing treatment or monitoring may affect protection. Missed-dose questions require professional advice; no individual target is supplied here.",
    "source_url": "https://www.nth.nhs.uk/resources/anticoagulants-blood-thinners/",
    "source_title": "Anticoagulants (Blood Thinners) - North Tees and Hartlepool NHS Foundation Trust",
    "source_label": "NHS البريطانية: تحليل سيولة الدم",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: The INR blood test"
  },
  {
    "id": "statins",
    "title_ar": "إيه فايدة أدوية الستاتين",
    "title_en": "Statins",
    "topic_tags": [
      "ستاتين",
      "ستاتينات",
      "statins"
    ],
    "permitted_questions": [
      "إيه فايدة الستاتين",
      "ليه الدكتور كاتب دوا للكوليسترول"
    ],
    "text_ar": "الستاتين اسم مجموعة أدوية بتقلل كمية الكوليسترول اللي الجسم بيصنعها. الطبيب ممكن يكتبها ضمن خطة تقليل خطر مشاكل القلب والأوعية. الكوليسترول مادة الجسم محتاج جزء منها، لكن زيادتها ممكن تضر الأوعية مع الوقت. اختيار العلاج بيعتمد على تقييم الحالة ككل، مش على إحساس الشخص بس. اسم المجموعة مبيحددش جرعة ولا ميعاد مناسب لكل الناس. لو عندك سؤال عن الدوا اللي مكتوب ليك، التفاصيل الشخصية موجودة في أمر الدكتور الحالي في خطتك.",
    "text_en": "Statins are a group of medicines that reduce the cholesterol the body produces. A clinician may prescribe them as part of cardiovascular risk management. The body needs some cholesterol, but excessive cholesterol can damage blood vessels over time. Treatment is selected from an overall assessment, not symptoms alone. A medicine-group name does not specify an individual dose or schedule. Your own instructions come from your current prescription.",
    "source_url": "https://www.nhs.uk/medicines/statins/",
    "source_title": "Statins - NHS",
    "source_label": "NHS البريطانية: إيه فايدة أدوية الستاتين",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: Statins"
  },
  {
    "id": "ldl",
    "title_ar": "يعني إيه الكوليسترول الضار",
    "title_en": "What LDL means",
    "topic_tags": [
      "LDL",
      "كوليسترول ضار",
      "الكوليسترول",
      "cholesterol"
    ],
    "permitted_questions": [
      "يعني إيه LDL",
      "إيه الفرق بين الكوليسترول الكلي والضار"
    ],
    "text_ar": "LDL هو النوع اللي ناس كتير بتسميه الكوليسترول الضار، لأنه ممكن يساهم في تراكم الدهون جوه الشرايين. تحليل الدهون فيه أكتر من جزء، والرقم الكلي مش هو نفسه كل جزء من الأجزاء. الجسم محتاج كوليسترول لبعض وظائفه، فالموضوع مش مجرد إن كل الدهون وحشة. الدكتور بيبص على التحليل مع عوامل الخطر وباقي حالتك. الهدف اللي يناسبك يتحدد في خطتك، ومفيش رقم هدف شخصي مصدره شرح اسم التحليل لوحده.",
    "text_en": "LDL is often called bad cholesterol because it can contribute to fatty deposits in arteries. A lipid test contains different measurements, and total cholesterol is not identical to each component. The body needs cholesterol for some functions. Clinicians interpret measurements alongside overall cardiovascular risk. Your personal target belongs to your care plan; explaining the test’s name does not establish a target or interpret your result.",
    "source_url": "https://www.essex.icb.nhs.uk/health/prevention/live-well/cardiovascular-health/cholesterol/",
    "source_title": "High cholesterol | Causes, testing and treatment",
    "source_label": "NHS البريطانية: يعني إيه الكوليسترول الضار",
    "retrieved_on": "2026-09-07",
    "reviewed_by": "Clinical reviewer of record",
    "version": "education-v1-2026-09-07",
    "content_kind": "clinical",
    "source_label_en": "NHS: What LDL means"
  },
  {
